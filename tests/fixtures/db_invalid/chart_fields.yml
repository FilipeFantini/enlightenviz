board: chart_fields
title: Chart fields
queries:
  a:
    sql: select day, events from earthquakes_daily
charts:
  - title: Known columns, in encode and in dimensions
    query: a
    echarts:
      dimensions: [day, events]
      series:
        - {type: bar, encode: {x: day, y: events}}
        - {type: line, encode: {x: day, y: events}}
      visualMap: {dimension: events}
      xAxis: {type: category}
  - title: A column the query does not return
    query: a
    echarts:
      xAxis: {type: category}
      series:
        - {type: bar, encode: {x: day, y: events}}
        - {type: bar, encode: {x: day, y: event_count}}
