board: chart-spec
title: Chart specifications
queries:
  a:
    sql: select 1 as n, 'x' as label
charts:
  - title: Data in the specification
    query: a
    echarts:
      dataset: {source: []}
      series:
        - {type: bar, data: [1, 2]}
  - title: Links
    query: a
    echarts:
      title: {text: t, link: "https://example.com/"}
      series:
        - {type: scatter, symbol: "image://point.png"}
        - {type: scatter, symbol: "//cdn.example.com/p.png"}
  - title: A url and an href
    query: a
    echarts:
      series:
        - {type: custom, url: "x", href: "y"}
  - title: The world map is allowed, a world dataset is not
    query: a
    echarts:
      geo: {map: world}
      series:
        - {type: bar, data: {name: world}}
