[package]
name = "enlightenviz"
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
description = "A small server that draws dashboards written as code."
license = "Apache-2.0"
repository = "https://github.com/FilipeFantini/enlightenviz"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
deadpool-postgres = "0.14"
form_urlencoded = "1"
saphyr = { version = "0.3", default-features = false }
saphyr-parser = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal"] }
tokio-postgres = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "process", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
