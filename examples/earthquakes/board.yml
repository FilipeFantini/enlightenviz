# An example board, over the invented data in schema.sql.
# The format is described in docs/boards.md.
board: earthquakes
title: Earthquakes, January 2024
text: Invented data, for trying the server out.

queries:
  by_day:
    sql: |
      select day, region, events
      from earthquakes_daily
      where day >= $from
        and day <= $to
        and region = any($regions)
      order by day, region
    params:
      from: {type: date, default: "2024-01-01"}
      to: {type: date, default: "2024-01-30"}
      regions:
        type: "list<text>"
        default: [Andes, Cascadia, Hokkaido, Rift Valley]

  strongest:
    sql: |
      select region, max(max_magnitude) as magnitude
      from earthquakes_daily
      where events >= $min_events
      group by region
      order by magnitude desc, region
    params:
      min_events: {type: integer, default: 1}

charts:
  - title: Events a day
    query: by_day
    vega_lite:
      mark: bar
      encoding:
        x: {field: day, type: temporal}
        y: {field: events, type: quantitative}
        color: {field: region, type: nominal}

  - title: Strongest quake by region
    query: strongest
    vega_lite:
      mark: bar
      encoding:
        x: {field: region, type: nominal, sort: "-y"}
        y: {field: magnitude, type: quantitative}
